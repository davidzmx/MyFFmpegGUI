name: Build Installers & Packages

on:
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde GitHub con un clic
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build-linux-deb:
    name: Construir Paquete Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Construir paquete Debian
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Subir artefacto .deb
        uses: actions/upload-artifact@v4
        with:
          name: myffmpeg-gui_linux_deb
          path: dist/*.deb

  build-windows:
    name: Construir Windows (.exe instalador y portable .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar ejecutable con PyInstaller
        run: |
          pyinstaller --noconsole `
                      --name "MyFFmpegGUI" `
                      --icon "assets/icon.ico" `
                      --add-data "ui;ui" `
                      --add-data "assets;assets" `
                      --hidden-import "PyQt5.QtCore" `
                      --hidden-import "PyQt5.QtWidgets" `
                      --hidden-import "PyQt5.QtGui" `
                      main.py

      - name: Descargar e integrar FFmpeg y FFprobe oficiales para Windows
        shell: pwsh
        run: |
          # 1. Instalar FFmpeg mediante Chocolatey
          choco install ffmpeg --no-progress -y

          # 2. Localizar los ejecutables REALES (>10MB) dentro de chocolatey\lib (¡NO los shims de 35KB de chocolatey\bin!)
          $realFfmpeg = (Get-ChildItem -Path "$env:ProgramData\chocolatey\lib\ffmpeg" -Filter "ffmpeg.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1).FullName
          $realFfprobe = (Get-ChildItem -Path "$env:ProgramData\chocolatey\lib\ffmpeg" -Filter "ffprobe.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1).FullName

          # 3. Fallback: Si Chocolatey no tiene los binarios reales, descargar el paquete oficial Gyan.dev essentials
          if (-not $realFfmpeg -or -not $realFfprobe) {
              Write-Host "Descargando binarios oficiales de FFmpeg desde Gyan.dev..."
              Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg_release.zip"
              Expand-Archive -Path "ffmpeg_release.zip" -DestinationPath "ffmpeg_temp"
              $realFfmpeg = (Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1).FullName
              $realFfprobe = (Get-ChildItem -Path "ffmpeg_temp" -Filter "ffprobe.exe" -Recurse | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1).FullName
          }

          New-Item -ItemType Directory -Force -Path "bin"
          Copy-Item -Path $realFfmpeg -Destination "bin\ffmpeg.exe" -Force
          Copy-Item -Path $realFfprobe -Destination "bin\ffprobe.exe" -Force

          $ffmpegSize = [math]::Round(((Get-Item "bin\ffmpeg.exe").Length / 1MB), 2)
          $ffprobeSize = [math]::Round(((Get-Item "bin\ffprobe.exe").Length / 1MB), 2)
          Write-Host "FFmpeg real verificado: bin\ffmpeg.exe ($ffmpegSize MB)"
          Write-Host "FFprobe real verificado: bin\ffprobe.exe ($ffprobeSize MB)"

          if ($ffmpegSize -lt 10) { throw "Error critico: ffmpeg.exe mide $ffmpegSize MB (es un shim, no el ejecutable real)" }
          if ($ffprobeSize -lt 10) { throw "Error critico: ffprobe.exe mide $ffprobeSize MB (es un shim, no el ejecutable real)" }

      - name: Empaquetar Versión Portable (.zip)
        shell: pwsh
        run: |
          Copy-Item -Path "dist\MyFFmpegGUI" -Destination "dist\MyFFmpegGUI_Portable" -Recurse
          New-Item -ItemType Directory -Force -Path "dist\MyFFmpegGUI_Portable\bin"
          Copy-Item -Path "bin\ffmpeg.exe" -Destination "dist\MyFFmpegGUI_Portable\bin\" -Force
          Copy-Item -Path "bin\ffprobe.exe" -Destination "dist\MyFFmpegGUI_Portable\bin\" -Force
          Copy-Item -Path "README.md" -Destination "dist\MyFFmpegGUI_Portable\" -ErrorAction SilentlyContinue
          Copy-Item -Path "instalar_menu_contextual_windows.reg" -Destination "dist\MyFFmpegGUI_Portable\" -ErrorAction SilentlyContinue
          Copy-Item -Path "desinstalar_menu_contextual_windows.reg" -Destination "dist\MyFFmpegGUI_Portable\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist\MyFFmpegGUI_Portable" -DestinationPath "dist\MyFFmpegGUI_Portable_Windows.zip" -Force

      - name: Instalar Inno Setup con Chocolatey
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Compilar Instalador de Windows (.exe)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_windows.iss

      - name: Subir Instalador Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: MyFFmpegGUI_Windows_Setup_Exe
          path: Output/*.exe

      - name: Subir Paquete Portable Windows (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: MyFFmpegGUI_Windows_Portable_Zip
          path: dist/MyFFmpegGUI_Portable_Windows.zip
